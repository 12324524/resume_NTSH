
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask2 日文字典</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF9C4; /* 淺黃色背景 */
            color: #333;
        }

        header {
            background-color: #FBC02D; /* 黃色標題 */
            color: white;
            padding: 10px;
            text-align: center;
        }

        section {
            margin: 20px;
        }

        .form-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>日文字典</h1>
    </header>

    <section>
        <div class="form-box">
            <form action="/ask2" method="post">
                <label for="question">中文:</label><br>
                <input type="text" id="question" name="question"
                       value="{{ question }}"><br><br>

                <label for="answer">日文:</label><br>
                <input type="text" id="answer" name="answer"
                       readonly value="{{ answer }}"><br><br>

                <input type="submit" value="送出">
                <input type="button" value="回首頁"
                       onclick="window.location.href='/'">
            </form>
        </div>
    </section>
</body>
</html>
